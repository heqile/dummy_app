name: Back-merge main or release into develop

on:
  push:
    branches:
      - main
      - 'release/*'

permissions:
  contents: write
  pull-requests: write

jobs:
  back-merge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: auto-create-pr-after-merge
        uses: ./.github/workflows/actions/auto-create-pr-after-merge
