name: auto-create-pr-after-merge
description: Create PR to default branch automatically after merge a PR to a target branch (only 'main' and 'release/*' branches are supported)
runs:
  using: "composite"
  steps:
    - name: Checkout
      uses: actions/checkout@v6
    - name: Create or update back-merge PR
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        BASE_BRANCH="${{ github.event.repository.default_branch }}"
        HEAD_BRANCH="${GITHUB_REF_NAME}"
        PR_TITLE="Back-merge ${HEAD_BRANCH} into ${BASE_BRANCH}"
        PR_BODY="Automated PR to sync changes from '${HEAD_BRANCH}' back into '${BASE_BRANCH}'."

        if [[ "${HEAD_BRANCH}" == "main" ]]; then
          PR_BRANCH="feature/main_to_dev"
        elif [[ "${HEAD_BRANCH}" == release/* ]]; then
          PR_BRANCH="feature/release_to_dev"
        else
          echo "Unsupported source branch: ${HEAD_BRANCH}"
          exit 1
        fi

        git checkout -b "${PR_BRANCH}"

        EXISTING_PR_NUMBER="$(
          gh pr list \
            --base "${BASE_BRANCH}" \
            --head "${PR_BRANCH}" \
            --state open \
            --json number \
            --jq '.[0].number // empty'
        )"

        if [ -n "$EXISTING_PR_NUMBER" ]; then
          echo "Open PR already exists: #$EXISTING_PR_NUMBER"
          # update branch
          git push --force origin "${PR_BRANCH}"
          exit 0
        fi

        git fetch origin ${BASE_BRANCH}
        if git diff --quiet "origin/${BASE_BRANCH}" "${PR_BRANCH}"; then
          echo "No changes between ${BASE_BRANCH} and ${PR_BRANCH}; skipping PR creation."
          exit 0
        fi
        
        git push -u origin "${PR_BRANCH}"

        gh pr create \
          --base "${BASE_BRANCH}" \
          --head "${PR_BRANCH}" \
          --title "${PR_TITLE}" \
          --body "${PR_BODY}"
